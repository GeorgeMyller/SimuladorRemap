# Configuração do Alembic (platform-foundation RF-10, D-10).
# A URL do banco NÃO fica aqui: o env.py lê-a de simremap.core.config.Settings
# (SIMREMAP_DATABASE_URL / DATABASE_URL / SIMREMAP_DATA_DIR), salvo override
# programático em config.attributes["database_url"] ou -x database_url=...
[alembic]
script_location = %(here)s/src/simremap/db/migrations
prepend_sys_path = %(here)s/src
version_path_separator = os
file_template = %%(rev)s
truncate_slug_length = 40
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
