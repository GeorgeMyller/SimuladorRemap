[project]
name = "simremap"
version = "0.1.0"
description = "Simulador de remap automotivo em dinamômetro (monólito modular FastAPI)."
readme = { text = "SimuladorRemap backend", content-type = "text/plain" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.21",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "numpy>=2.0",
    "structlog>=24.1",
    "rfc8785>=0.1.4",
    "redis>=5.0",
    "orjson>=3.10",
    "httpx>=0.27",
    "laya>=0.4.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-benchmark>=4",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
    "maturin>=1.7",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simremap"]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
url = "https://pkgs.safetycli.com/repository/public/pypi/simple/"
default = true

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/simremap/db/migrations/versions/*.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "PL", "TID", "NPY"]
ignore = [
    "PLR0913", # construtores com muitos parâmetros físicos são esperados
    "PLR0917", # rotas de dependência e testes parametrizados têm muitos argumentos
    "PLC0415", # imports sob demanda e prevenção de import circular
    "RUF001",  # textos em pt-BR usam caracteres ambíguos legítimos
    "RUF002",
    "RUF003",
]

# D-07: API banida no código do laço de simulação. A proibição vale para todo o
# projeto e é liberada (per-file-ignores) só nos pacotes fora do laço:
# core, api, db, catalog, scenarios e tests. Pacotes do laço: physics, damage,
# ecu, profiles, dyno e telemetry.
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time".msg = "D-07: relógio de parede proibido no laço; use t_sim_s = tick_index / sim_hz."
"random".msg = "D-07: use numpy.random.Generator(PCG64) semeado (contracts/simulation-bus.md §5)."
"numpy.random.seed".msg = "D-07: estado global do NumPy proibido; use Generator(PCG64(SeedSequence))."
"numpy.random.rand".msg = "D-07: estado global do NumPy proibido; use Generator semeado."
"numpy.random.randn".msg = "D-07: estado global do NumPy proibido; use Generator semeado."
"numpy.random.randint".msg = "D-07: estado global do NumPy proibido; use Generator semeado."
"numpy.random.random".msg = "D-07: estado global do NumPy proibido; use Generator semeado."
"numpy.random.random_sample".msg = "D-07: estado global do NumPy proibido; use Generator semeado."
"numpy.random.normal".msg = "D-07: estado global do NumPy proibido; use Generator semeado."
"numpy.random.uniform".msg = "D-07: estado global do NumPy proibido; use Generator semeado."
"numpy.random.choice".msg = "D-07: estado global do NumPy proibido; use Generator semeado."
"numpy.random.shuffle".msg = "D-07: estado global do NumPy proibido; use Generator semeado."
"numpy.random.permutation".msg = "D-07: estado global do NumPy proibido; use Generator semeado."
"numpy.random.poisson".msg = "D-07: estado global do NumPy proibido; use Generator semeado."
"numpy.random.exponential".msg = "D-07: estado global do NumPy proibido; use Generator semeado."
"numpy.random.RandomState".msg = "D-07: RandomState legado proibido; use Generator(PCG64)."
"numpy.random.default_rng".msg = "D-07: construa Generator(PCG64(SeedSequence(seed, spawn_key=...)))."

[tool.ruff.lint.per-file-ignores]
"src/simremap/core/**" = ["TID251"]
"src/simremap/api/**" = ["TID251"]
"src/simremap/db/**" = ["TID251"]
"src/simremap/catalog/**" = ["TID251"]
"src/simremap/scenarios/**" = ["TID251"]
"src/simremap/ai/**" = ["TID251"]
"src/simremap/db/migrations/versions/*.py" = ["TID251", "E501"]
"tests/**" = ["TID251", "S101", "S311", "PLR2004", "PLC0415", "S105", "S106", "S108"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# tests/ é pacote (``__init__.py``) para nomes únicos (tests.core.test_contracts, ...).
# Os ajudantes importados por nome via ``sys.path`` (scn_helpers, dyno_helpers, ...)
# saem da varredura e resolvem pelos diretórios abaixo, como no pytest.
mypy_path = [
    "src",
    "tests/damage",
    "tests/dyno",
    "tests/e2e",
    "tests/qa",
    "tests/scenarios",
    "tests/telemetry",
]
files = ["src/simremap"]
warn_unreachable = true
exclude = [
    "src/simremap/db/migrations/versions/",
    '^tests/.*/(?!test_|conftest\.py|__init__\.py)[^/]+\.py$',
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["rfc8785.*", "asgi_lifespan.*", "laya.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --import-mode=importlib"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "bench: benchmarks de desempenho (make bench, fora de make check)",
    "accuracy: desvio contra Reference Benchmark Baseline v1 (make accuracy)",
    "e2e: jornadas ponta a ponta (make e2e)",
    "postgres: exige PostgreSQL 16 (matriz de migrações)",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["simremap"]
branch = true
concurrency = ["greenlet", "thread"]
omit = ["*/db/migrations/versions/*", "*/db/migrations/env.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

# ---------------------------------------------------------------- bandit
[tool.bandit]
exclude_dirs = ["tests"]
