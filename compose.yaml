# Base comum (platform-foundation seção 8; D-03, D-32). Use sempre com um perfil:
#   docker compose -f compose.yaml -f compose.prod.yaml up -d      (produção / estação)
#   docker compose -f compose.yaml -f compose.dev.yaml up          (desenvolvimento)
#   docker compose -f compose.yaml -f compose.staging.yaml up -d   (staging com PostgreSQL/Redis)
# Serviços opcionais: --profile postgres e --profile redis.
name: simremap

services:
  app:
    image: simremap:${SIMREMAP_VERSION:-0.1.0}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
        BUILD_TIME_UTC: ${BUILD_TIME_UTC:-}
    ports:
      - "${SIMREMAP_PORT:-8000}:8000"
    volumes:
      - simremap-data:/data
      - ./data:/app/data:ro
      - ./data/logs:/data/logs
    environment:
      SIMREMAP_ENV: ${SIMREMAP_ENV:-prod}
      SIMREMAP_LOG_LEVEL: ${SIMREMAP_LOG_LEVEL:-INFO}
      SIMREMAP_BIND_PUBLIC: ${SIMREMAP_BIND_PUBLIC:-true}
      SIMREMAP_MAX_ACTIVE_SESSIONS: ${SIMREMAP_MAX_ACTIVE_SESSIONS:-10}
      SIMREMAP_SIM_HZ: ${SIMREMAP_SIM_HZ:-250}
      SIMREMAP_DATA_DIR: /data
      SIMREMAP_LOG_FILE: /data/logs/simremap.log
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=2).status==200 else 1)"
      interval: 10s
      timeout: 2s
      retries: 6
      start_period: 60s
    stop_grace_period: 10s

  postgres:
    image: postgres:16-alpine
    profiles: [postgres]
    environment:
      POSTGRES_USER: simremap
      POSTGRES_PASSWORD: ${SIMREMAP_PG_PASSWORD:-simremap}
      POSTGRES_DB: simremap
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - simremap-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simremap -d simremap"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    profiles: [redis]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  simremap-data:
  simremap-pg:
